[package]
name = "openfeo-harness"
description = "OpenFeO QEMU/netns test harness (rootless)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
nix.workspace = true
openfeo-net = { path = "../crates/openfeo-net" }
openfeo-nft = { path = "../crates/openfeo-nft" }
openfeo-proto-dhcp4 = { path = "../crates/openfeo-proto-dhcp4" }
openfeo-proto-sntp = { path = "../crates/openfeo-proto-sntp" }
