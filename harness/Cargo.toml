serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
ipnet.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }
openfeo-apply = { path = "../crates/openfeo-apply" }
openfeo-config = { path = "../crates/openfeo-config" }
openfeo-netlink = { path = "../crates/openfeo-netlink" }
openfeo-platform = { path = "../crates/openfeo-platform" }
openfeo-proto-dhcp6 = { path = "../crates/openfeo-proto-dhcp6" }
