#
# The lab's tagged PPPoE configuration (M3): as vm-pppoe.toml, with WAN A's PPPoE on VLAN 101 of
# p0 (`p0.101`), as the lines that carry their PPPoE in a tagged VLAN have.
config_version = 1

[system]
hostname = "openfeo"
domain = "home.arpa"
ntp_servers = ["ntp.isp.example"]

[[wans]]
name = "wan0"
port = "p0"
vlan = 101
priority = 10
[wans.pppoe]
username = "openfeo@isp.example"
password = "example-secret"
[wans.ipv6]
prefix = "2001:db8:1::/48"

[[lans]]
name = "lan0"
ports = ["p2"]
ipv4 = "192.168.1.1/24"
ipv6 = "2001:db8:1:222::1/64"
[lans.dhcp]
range = ["192.168.1.100", "192.168.1.200"]
lease_secs = 43200

[firewall]
wan_ping = true
