#
# The lab's IPv6 configuration (M2 part 2): the static IPv4 WAN and lan0 of vm-static.toml, the
# ISP routing 2001:db8:1::/48 to the router (no typed gateway: the default router is learned from
# the ISP's advertisements), lan0 advertising 2001:db8:1:222::/64, a DMZ on p3 (lan1) numbered
# from 192.0.2.232/29 and 2001:db8:1:232::/64 with advertisements off (its hosts are placed by
# hand), a rule opening tcp 80 to the DMZ host over IPv6, a typed AAAA record for it, and a
# typed IPv6 upstream beside the IPv4 one. Used by the m2 IPv6 scenarios and the reconcile
# snapshot tests.
config_version = 1

[system]
hostname = "openfeo"
domain = "home.arpa"
ntp_servers = ["ntp.isp.example"]

[[wans]]
name = "wan0"
port = "p0"
priority = 10
[wans.static]
address = "203.0.113.10/24"
gateway = "203.0.113.1"
dns = ["203.0.113.1"]
[wans.ipv6]
prefix = "2001:db8:1::/48"

[[public_ipv4]]
prefix = "192.0.2.232/29"

[[lans]]
name = "lan0"
ports = ["p2"]
ipv4 = "192.168.1.1/24"
ipv6 = "2001:db8:1:222::1/64"
[lans.dhcp]
range = ["192.168.1.100", "192.168.1.200"]
lease_secs = 43200
[[lans.dhcp.static]]
mac = "52:54:00:fe:10:10"
ip = "192.168.1.10"
hostname = "nas"

[[lans]]
name = "dmz"
ports = ["p3"]
ipv4 = "192.0.2.233/29"
ipv6 = "2001:db8:1:232::1/64"
ra = false

[dns]
upstreams = ["203.0.113.1", "2001:db8:ffff::1"]
[[dns.records]]
name = "www"
address = "2001:db8:1:232::10"

[firewall]
wan_ping = true

[[firewall.port_forwards]]
name = "lan-http"
proto = "tcp"
port = 2222
to = "192.168.1.2"
to_port = 8080

[[firewall.rules]]
name = "dmz-web6"
from = "wan"
to = "2001:db8:1:232::10"
proto = "tcp"
ports = ["80"]
