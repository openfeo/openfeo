#
# The lab's static configuration: WAN A on p0 towards isp0 (203.0.113.1), a LAN on p2 towards
# lan0, p1 unassigned. No [[ports]] section: the live map assigns p0..p2 in PCI order, which is
# QEMU's device order.
config_version = 1

[system]
hostname = "openfeo"
domain = "home.arpa"
ntp_servers = ["ntp.isp.example"]    # the lab's time server, by the name dnsmasq answers

[[wans]]
name = "wan0"
port = "p0"
priority = 10
[wans.static]
address = "203.0.113.10/24"
gateway = "203.0.113.1"
dns = ["203.0.113.1"]

[[lans]]
name = "lan0"
ports = ["p2"]
ipv4 = "192.168.1.1/24"
[lans.dhcp]
range = ["192.168.1.100", "192.168.1.200"]
lease_secs = 43200
[[lans.dhcp.static]]
mac = "52:54:00:fe:10:10"
ip = "192.168.1.10"
hostname = "nas"

[firewall]
wan_ping = true                 # the lab pings the WAN address from the ISP side

[[firewall.port_forwards]]
name = "lan-http"
proto = "tcp"
port = 2222
to = "192.168.1.2"
to_port = 8080
