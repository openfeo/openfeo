[graph]
all-features = true

[licenses]
# SPEC §14 and ADR-0021: the licences the project accepts in the shipped GPLv2 binary; Apache-2.0 is accepted knowingly.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "LGPL-2.1-or-later",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "CC0-1.0",
    "Unlicense",
    # smoltcp, the NDP test oracle (ADR-0018); a dev and fuzz dependency only.
    "0BSD",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal `path = ".."` dependencies carry no version; that is not a wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
