[package]
name = "openfeo"
description = "OpenFeO: a tiny Linux router; PID 1 and control plane in one static binary"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Test hooks (`openfeo.chaos=` on the kernel command line). Never enabled in a release image (ADR-0007).
harness = []

[dependencies]
openfeo-init = { path = "../openfeo-init" }
openfeo-platform = { path = "../openfeo-platform" }
openfeo-config = { path = "../openfeo-config" }
openfeo-world = { path = "../openfeo-world" }
openfeo-runtime = { path = "../openfeo-runtime" }
openfeo-netlink = { path = "../openfeo-netlink" }
openfeo-nft = { path = "../openfeo-nft" }
openfeo-reconcile = { path = "../openfeo-reconcile" }
openfeo-apply = { path = "../openfeo-apply" }
openfeo-net = { path = "../openfeo-net" }
openfeo-proto-dhcp4 = { path = "../openfeo-proto-dhcp4" }
openfeo-proto-dns = { path = "../openfeo-proto-dns" }
openfeo-proto-sntp = { path = "../openfeo-proto-sntp" }
ipnet.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
futures.workspace = true
mimalloc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
