syntax = "proto3";

package openfeo.v1;

import "openfeo/v1/config.proto";
import "openfeo/v1/events.proto";
import "openfeo/v1/state.proto";

// The API (SPEC §8.3). The same request and response messages travel over gRPC, inside the
// WebSocket envelope, and as the bodies of the few plain HTTP calls.

// ---- The WebSocket envelope ----

message ClientMsg {
  // Echoed in the reply.
  uint32 id = 1;
  oneof body {
    Auth auth = 2;
    Subscribe subscribe = 3;
    Unsubscribe unsubscribe = 4;
    Request request = 5;
  }
}

message ServerMsg {
  // 0 = an unsolicited push.
  uint32 id = 1;
  oneof body {
    Response response = 2;
    Event event = 3;
    Telemetry telemetry = 4;
    Error error = 5;
  }
}

// The first frame on a WebSocket, within 5 s.
message Auth {
  string token = 1;
}

message Subscribe {
  // `state`, `counters` or `events`.
  string topic = 1;
  // For `events`: send this many recent events first.
  uint32 backlog = 2;
}

message Unsubscribe {
  string topic = 1;
}

message Request {
  oneof body {
    GetStateRequest get_state = 1;
    LogoutRequest logout = 2;
    ChangePasswordRequest change_password = 3;
    GetConfigRequest get_config = 4;
    ValidateConfigRequest validate_config = 5;
    ApplyConfigRequest apply_config = 6;
    ConfirmConfigRequest confirm_config = 7;
    RevertConfigRequest revert_config = 8;
  }
}

// An empty body acknowledges `Auth`, `Subscribe` and `Unsubscribe`.
message Response {
  oneof body {
    GetStateResponse get_state = 1;
    LogoutResponse logout = 2;
    ChangePasswordResponse change_password = 3;
    GetConfigResponse get_config = 4;
    ValidateConfigResponse validate_config = 5;
    ApplyConfigResponse apply_config = 6;
    ConfirmConfigResponse confirm_config = 7;
    RevertConfigResponse revert_config = 8;
  }
}

// A coalesced push: a slow reader is only ever sent the latest.
message Telemetry {
  string topic = 1;
  oneof body {
    State state = 2;
    Counters counters = 3;
  }
}

// gRPC's code names, so both transports report failures alike.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_FAILED_PRECONDITION = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_RESOURCE_EXHAUSTED = 5;
  ERROR_CODE_DATA_LOSS = 6;
  ERROR_CODE_INTERNAL = 7;
  ERROR_CODE_UNAVAILABLE = 8;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  // With RESOURCE_EXHAUSTED after a wrong password: how long to wait.
  uint32 retry_after_secs = 3;
}

// ---- Authentication ----

message Session {
  // The bearer token: 32 random bytes, base64url.
  string token = 1;
  // The session lapses after this long with no request and no socket.
  uint32 idle_secs = 2;
}

message LoginRequest {
  string password = 1;
}

message LoginResponse {
  Session session = 1;
}

message SetInitialPasswordRequest {
  string password = 1;
}

message SetInitialPasswordResponse {
  Session session = 1;
}

message LogoutRequest {}

message LogoutResponse {}

message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  // Allowed only while no password is set.
  rpc SetInitialPassword(SetInitialPasswordRequest) returns (SetInitialPasswordResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Ends every other session.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}

// ---- State ----

message GetStateRequest {}

message GetStateResponse {
  State state = 1;
}

message SubscribeRequest {
  repeated string topics = 1;
  // For `events`: send this many recent events first.
  uint32 backlog = 2;
}

message SubscribeResponse {
  oneof body {
    State state = 1;
    Counters counters = 2;
    Event event = 3;
  }
}

service StateService {
  rpc GetState(GetStateRequest) returns (GetStateResponse);
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}

// ---- Config (SPEC §5.5, §8.3) ----

message GetConfigRequest {}

message GetConfigResponse {
  // The running config, without its secrets: the admin's password hash and every PPPoE
  // password are empty.
  Config config = 1;
  // Tells this config from any other; an apply names the one it was edited from.
  string tag = 2;
  // The window an apply is given when it names none.
  uint32 confirm_secs = 3;
}

message ValidateConfigRequest {
  Config config = 1;
}

// What applying a config means for whoever asks.
message Caller {
  // The change takes away the router address this connection arrived at.
  bool connection_drops = 1;
  // The caller's LAN changes its IPv4 address or subnet, or is removed: the leases its
  // devices hold, the caller's included, no longer fit.
  bool lan_changes = 2;
  // The caller's LAN, when the router could tell.
  string lan = 3;
  // The router's IPv4 address on that LAN afterwards; empty when the LAN is removed.
  string router_after = 4;
}

message ValidateConfigResponse {
  // What is wrong. When there is anything here the other fields are empty.
  repeated ConfigViolation violations = 1;
  // What applying it would interrupt.
  repeated ConfigEffect effects = 2;
  Caller caller = 3;
}

message ApplyConfigRequest {
  // The whole config. An empty PPPoE password on a WAN that is PPPoE in the running config
  // under the same name keeps the one in force; the admin's password hash is never taken.
  Config config = 1;
  // The tag of the config this one was edited from. Refused when that is no longer the one
  // running.
  string tag = 2;
  // Apply with no window: the change stands at once and nothing reverts it. Left out, the
  // change is pending until it is confirmed.
  bool immediate = 3;
  // The window, 10 to 600 s; 0 for the router's default.
  uint32 timeout_secs = 4;
}

message ApplyConfigResponse {
  // The tag of the config now running.
  string tag = 1;
}

message ConfirmConfigRequest {}

message ConfirmConfigResponse {}

message RevertConfigRequest {}

message RevertConfigResponse {}

service ConfigService {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  // Changes nothing.
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
  rpc ApplyConfig(ApplyConfigRequest) returns (ApplyConfigResponse);
  rpc ConfirmConfig(ConfirmConfigRequest) returns (ConfirmConfigResponse);
  rpc RevertConfig(RevertConfigRequest) returns (RevertConfigResponse);
}

// ---- Plain HTTP, before login ----

// `GET /api/status`.
message GetStatusResponse {
  string hostname = 1;
  string domain = 2;
  // No password is set and one may be: `POST /api/password`.
  bool needs_password = 3;
  // `config.toml` was refused; the router runs on first-boot defaults.
  bool config_refused = 4;
  string tls_fingerprint = 5;
  // The refused file is not even TOML: no password can be read from it, none may be set
  // over it, and nobody can log in until it is fixed or removed from the console.
  bool config_unreadable = 6;
}
