syntax = "proto3";

package openfeo.v1;

// The whole router configuration (SPEC §8). On disk as `/state/config.toml`, keyed by these field
// names (the canonical JSON mapping spelled in TOML). Field numbers are never reused; removed
// fields become `reserved`.
message Config {
  // Schema version of the file; `migrate(n -> n+1)` runs at load (SPEC §8.2).
  uint32 config_version = 1;
  System system = 2;
  // Port identity -> kernel name, mirroring `/state/identity/portmap` (SPEC §7.1).
  repeated PortMapEntry ports = 3;
  repeated Wan wans = 4;
  repeated Lan lans = 5;
  Firewall firewall = 6;
  Dns dns = 7;
  // Public IPv4 blocks the ISP routes to this router (SPEC §7.4, §7.5; `[[public_ipv4]]`).
  repeated PublicIpv4 public_ipv4 = 8;
}

// A block of public IPv4 addresses routed to this router. A LAN numbered from it is a public LAN
// (no translation, inbound by rule); addresses no LAN uses may front port forwards. Every block
// gets a blackhole route.
message PublicIpv4 {
  // The block, "192.0.2.232/29"; global unicast, disjoint from every other block and subnet.
  string prefix = 1;
}

// The DNS forwarder (SPEC §7.7; `[dns]` in §8.2).
message Dns {
  // Upstream resolvers, in order of preference; empty means the active WAN's learned servers
  // alone.
  repeated string upstreams = 1;
  // Reserved for block lists (post-MVP); must be empty.
  repeated string blocklists = 2;
  // Also use the servers the active WAN learned (DHCPv4 now, PPPoE and IPv6 later), after
  // `upstreams`. Absent means true.
  optional bool use_wan_dns = 3;
  // Names whose subdomains may resolve to private addresses (rebinding protection, SPEC §7.7).
  repeated string rebind_allow = 4;
}

// Firewall settings beyond the zone defaults of SPEC §7.5 (which the panel exposes in M4).
message Firewall {
  repeated PortForward port_forwards = 1;
  // Answer ICMP echo on WAN zones (SPEC §7.5 "optional ping"), rate limited; off by default.
  bool wan_ping = 2;
  // Holes opened before the zone policy (SPEC §7.5); they never translate.
  repeated Rule rules = 3;
}

// One DNAT from the router's own addresses, or from a public-block address (`address`), and by
// hairpin from LAN clients reaching that address, to a LAN host (SPEC §7.5).
message PortForward {
  // Unique among forwards; shows in logs and the API.
  string name = 1;
  // "tcp" or "udp".
  string proto = 2;
  // Destination port on the router, 1-65535; never one of the router's own services
  // (53, 67, 68, 80, 123, 443).
  uint32 port = 3;
  // IPv4 address inside one of the LANs.
  string to = 4;
  // Port on `to`; 0 = same as `port`.
  uint32 to_port = 5;
  // The public address this forward listens on: inside a `[[public_ipv4]]` block, outside every
  // LAN. Empty means the WAN address (any address of the router's own).
  string address = 6;
}

// One accepted hole in the forward chain (SPEC §7.5): new flows from zone `from` to the hosts in
// `to`, for `proto` and, for tcp/udp, `ports`.
message Rule {
  // Unique among rules; shows in logs and the API.
  string name = 1;
  // "wan" or a LAN name.
  string from = 2;
  // An address, an `a-b` range or a CIDR, inside one LAN that is not `from`.
  string to = 3;
  // "tcp", "udp", "icmp" or "any".
  string proto = 4;
  // For tcp/udp: ports as strings, "443" or "1000-1010"; forbidden otherwise.
  repeated string ports = 5;
}

message System {
  string hostname = 1;
  string domain = 2;
  string timezone = 3;
  repeated string ntp_servers = 4;
}

// One physical port: bus-path identity and the sticky kernel name it was given.
message PortMapEntry {
  // Bus-path identity, e.g. "pci-0000:02:00.0".
  string id = 1;
  // Kernel interface name, e.g. "p0".
  string name = 2;
}

// The file format of `/state/identity/portmap`.
message PortMap {
  repeated PortMapEntry ports = 1;
}

// A WAN is one port, optionally VLAN-tagged, with exactly one kind (SPEC §7.2).
message Wan {
  string name = 1;
  string port = 2;
  // 802.1Q VLAN id on the port; 0 = untagged.
  uint32 vlan = 3;
  // Lower wins when several WANs are up (SPEC §7.4).
  uint32 priority = 4;
  // Which table is present in the TOML selects the WAN type.
  oneof kind {
    StaticWan static = 5;
    DhcpWan dhcp = 6;
  }
}

// Address, gateway and DNS from config (SPEC §7.2 "Static").
message StaticWan {
  // "203.0.113.10/24".
  string address = 1;
  // "203.0.113.1".
  string gateway = 2;
  repeated string dns = 3;
}

// A WAN that takes its address from the ISP's DHCPv4 server (SPEC §7.2). Each option is sent
// only when set.
message DhcpWan {
  // Option 12, the host name as DNS labels; empty = not sent.
  string hostname = 1;
  // Option 60, the vendor class identifier, printable ASCII up to 255 bytes; empty = not sent.
  string vendor_class = 2;
}

// One classless static route of a lease (RFC 3442).
message Dhcp4Route {
  // "198.51.100.0/24"; "0.0.0.0/0" is the default route.
  string dst = 1;
  // "203.0.113.1".
  string via = 2;
}

// The file format of `/state/leases/dhcp4-<wan>.toml`: the last lease a WAN's DHCPv4 client
// held, confirmed with INIT-REBOOT after a reboot (SPEC §7.2). Ignored when `wan` or `mac` differ
// from the WAN reading it.
message Dhcp4Lease {
  string wan = 1;
  // The port's hardware address when the lease was taken, "52:54:00:fe:00:00".
  string mac = 2;
  // "203.0.113.100/24".
  string address = 3;
  // The server to renew with, "203.0.113.1".
  string server = 4;
  // Option 3's first router; empty when classless routes are present (RFC 3442).
  string gateway = 5;
  repeated string dns = 6;
  string domain = 7;
  // 0 = none.
  uint32 mtu = 8;
  repeated Dhcp4Route routes = 9;
  uint32 lease_secs = 10;
  uint32 t1_secs = 11;
  uint32 t2_secs = 12;
  // Wall-clock seconds when the ACK arrived; informational.
  uint64 obtained_unix = 13;
  repeated string ntp = 14;
  // Option 28; empty = none.
  string broadcast = 15;
}

// A LAN is a bridge of one or more members (SPEC §7.1): a port untagged ("p6") or a tagged VLAN
// on a port ("p6.224", ADR-0017).
message Lan {
  string name = 1;
  repeated string ports = 2;
  // The router's address and the LAN subnet, "192.168.1.1/24". Inside a `[[public_ipv4]]` block
  // the LAN is public (SPEC §7.5).
  string ipv4 = 3;
  // Present when the LAN runs a DHCPv4 server (SPEC §7.6).
  LanDhcp dhcp = 4;
  // Zones this LAN may initiate into: "wan", other LAN names, or the one word "none". Absent or
  // empty means ["wan"] (SPEC §7.5).
  repeated string reaches = 5;
}

// The DHCPv4 server of one LAN (SPEC §7.6; `[lans.dhcp]` in §8.2).
message LanDhcp {
  // The inclusive pool: exactly two host addresses of the LAN subnet, first <= last, the
  // router outside it.
  repeated string range = 1;
  // Lease time in seconds; 0 means 43200, otherwise at least 60.
  uint32 lease_secs = 2;
  repeated StaticLease static = 3;
  // DNS servers handed out; empty means the router.
  repeated string dns = 4;
  // NTP servers handed out (option 42); empty means the router, which serves SNTP (SPEC §7.10).
  repeated string ntp = 5;
}

// A static lease: the client with this MAC (or client identifier) always gets `ip` and
// resolves as `hostname`.
message StaticLease {
  string mac = 1;
  string ip = 2;
  // One DNS label; empty for no name.
  string hostname = 3;
  // Optional, lowercase hex: match the client identifier (option 61) instead of the MAC.
  string client_id = 4;
}

// One lease the server granted, kept in `/state/leases/dhcp4-server-<lan>.toml` (SPEC §5.2).
message Dhcp4ServerLease {
  string mac = 1;
  // Lowercase hex; empty when the client sent none.
  string client_id = 2;
  string address = 3;
  string hostname = 4;
  uint64 granted_unix = 5;
  uint64 expires_unix = 6;
}

// A LAN's lease database.
message Dhcp4ServerLeases {
  string lan = 1;
  repeated Dhcp4ServerLease leases = 2;
}
