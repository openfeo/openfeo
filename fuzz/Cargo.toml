[package]
name = "openfeo-config-fuzz"
description = "cargo-fuzz targets for OpenFeO parsers (SPEC §11); its own workspace, built with nightly"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-2.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
openfeo-config = { path = "../crates/openfeo-config" }
openfeo-proto-dhcp4 = { path = "../crates/openfeo-proto-dhcp4" }
# The oracle for the differential DHCPv4 target; a fuzz dependency only, never shipped.
dhcproto = "0.15"
openfeo-proto-dns = { path = "../crates/openfeo-proto-dns" }
openfeo-proto-sntp = { path = "../crates/openfeo-proto-sntp" }
# The oracle for the differential DNS target (ADR-0015); a fuzz dependency only, never shipped.
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
openfeo-proto-ndp = { path = "../crates/openfeo-proto-ndp" }
openfeo-proto-dhcp6 = { path = "../crates/openfeo-proto-dhcp6" }
openfeo-proto-ppp = { path = "../crates/openfeo-proto-ppp" }
# The oracle for the differential NDP target (ADR-0018); a fuzz dependency only, never shipped.
smoltcp = { version = "0.14", default-features = false, features = ["proto-ipv6", "medium-ethernet", "socket-udp"] }

[[bin]]
name = "config_toml"
path = "fuzz_targets/config_toml.rs"
test = false
doc = false
bench = false

