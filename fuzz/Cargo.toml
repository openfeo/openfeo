[package]
name = "openfeo-config-fuzz"
description = "cargo-fuzz targets for OpenFeO parsers (SPEC §11); its own workspace, built with nightly"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-2.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
openfeo-config = { path = "../crates/openfeo-config" }
openfeo-proto-dhcp4 = { path = "../crates/openfeo-proto-dhcp4" }
# The oracle for the differential DHCPv4 target; a fuzz dependency only, never shipped.
dhcproto = "0.15"

[[bin]]
name = "config_toml"
path = "fuzz_targets/config_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dhcp4_message"
path = "fuzz_targets/dhcp4_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dhcp4_differential"
path = "fuzz_targets/dhcp4_differential.rs"
test = false
doc = false
bench = false

[workspace]
