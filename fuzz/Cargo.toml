[package]
name = "openfeo-config-fuzz"
description = "cargo-fuzz targets for OpenFeO parsers (SPEC §11); its own workspace, built with nightly"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-2.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
openfeo-config = { path = "../crates/openfeo-config" }
openfeo-proto-dhcp4 = { path = "../crates/openfeo-proto-dhcp4" }
# The oracle for the differential DHCPv4 target; a fuzz dependency only, never shipped.
dhcproto = "0.15"
openfeo-proto-dns = { path = "../crates/openfeo-proto-dns" }
openfeo-proto-sntp = { path = "../crates/openfeo-proto-sntp" }
# The oracle for the differential DNS target (ADR-0015); a fuzz dependency only, never shipped.
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }

[[bin]]
name = "config_toml"
path = "fuzz_targets/config_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dhcp4_message"
path = "fuzz_targets/dhcp4_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dhcp4_differential"
path = "fuzz_targets/dhcp4_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dhcp4_server"
path = "fuzz_targets/dhcp4_server.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dhcp4_arp"
path = "fuzz_targets/dhcp4_arp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_message"
path = "fuzz_targets/dns_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_differential"
path = "fuzz_targets/dns_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_forwarder"
path = "fuzz_targets/dns_forwarder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sntp_packet"
path = "fuzz_targets/sntp_packet.rs"
test = false
doc = false
bench = false

[workspace]
