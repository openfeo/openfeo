#
# The TypeScript for proto/openfeo/v1 (SPEC §8.1), written into the client by `npm run gen`.
# The plugin is the workspace's own, so nothing is fetched when it runs; the output is built,
# not committed.
version: v2
clean: true
plugins:
  - local: ./node_modules/.bin/protoc-gen-es
    out: client/src/gen
    opt:
      - target=ts
      - import_extension=js
