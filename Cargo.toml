[workspace]
resolver = "3"
members = ["crates/*", "harness"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
rust-version = "1.99"

[workspace.dependencies]
libc = "0.2"
thiserror = "2"
anyhow = "1"
nix = { version = "0.30", features = ["sched", "mount", "user", "fs", "process", "signal", "net", "ioctl"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
# M1: async runtime, logging, netlink
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
futures = "0.3"
rtnetlink = "0.23"
netlink-packet-route = "0.33"
netlink-packet-core = "0.9"
netlink-sys = { version = "0.9", features = ["tokio"] }
# M1: config schema (protobuf is the source of truth, TOML on disk via pbjson)
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
protox = "0.10"
pbjson = "0.9"
pbjson-types = "0.9"
pbjson-build = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ipnet = { version = "2", features = ["serde"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
mimalloc = "0.1"
insta = { version = "1", features = ["yaml"] }
# M1 part 2b: differential oracle for openfeo-proto-dhcp4's codec; dev-dependency and fuzz only, never shipped
dhcproto = "0.15"
# M1 part 3b: differential oracle for openfeo-proto-dns's codec; dev-dependency and fuzz only, never shipped (ADR-0015)
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
# M4: the API (HTTPS, WebSocket, gRPC). rustls on ring only: no OpenSSL, no aws-lc (SPEC §13, deny.toml bans)
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "ws", "query"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
tonic = { version = "0.14", default-features = false, features = ["router", "codegen"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tokio-stream = { version = "0.1", features = ["sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
argon2 = "0.5"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
toml_edit = "0.23"
# M4: reads the certificate back in tests and in the harness; never shipped
x509-parser = "0.18"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
disallowed_methods = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
