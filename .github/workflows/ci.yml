#
# Mirrors `make ci`: lint and unit tests on one runner; kernel build plus the QEMU harness
# scenarios on another. The harness is rootless (ADR-0006) but Ubuntu 24.04 runners need
# unprivileged user namespaces re-enabled and /dev/kvm opened up for the runner user.
name: ci
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking compares against origin/main
      - name: install the musl C toolchain (mimalloc, libnftables), nftables build tools, e2fsprogs (harness unit tests), rsync (headers_install)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config bison flex e2fsprogs rsync
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt
      - uses: taiki-e/install-action@cargo-deny
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc # the web workspace: make web-lint, make web-test, make panel (ADR-0025)
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            build/kernel/linux-6.18.59.tar.xz
            build/nft/dl
          key: sources-${{ hashFiles('kernel/linux-6.18.59.sha256', 'nft/sources.txt') }}
      - name: fetch the pinned sources and install the kernel UAPI headers (ADR-0012)
        run: make kernel-src kernel-headers nft-src
      - run: make lint
      - run: make test
      - name: release binary (no test hooks) must build
        run: make bin FEATURES=

  kernel-and-harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: bufbuild/buf-action@v1 # the panel's message code is generated when the image is built
        with:
          setup_only: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc # the web workspace: make web-lint, make web-test, make panel (ADR-0025)
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install kernel build and harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 kea-dhcp4-server kea-dhcp6-server busybox-static dnsmasq-base bind9-dnsutils ntpsec-ntpdate radvd ndisc6 ppp pppoe iproute2 iputils-ping e2fsprogs musl-tools pkg-config bc flex bison libelf-dev libssl-dev ccache zstd cpio rsync
      - name: allow KVM and user namespaces for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: unconfine kea-dhcp4 and kea-dhcp6 (Ubuntu's profiles pin their configs to /etc/kea; ADR-0006)
        run: |
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.kea-dhcp4 || true
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.kea-dhcp6 || true
      - uses: actions/cache@v4
        with:
          path: |
            build/kernel/linux-6.18.59.tar.xz
            build/nft/dl
          key: sources-${{ hashFiles('kernel/linux-6.18.59.sha256', 'nft/sources.txt') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ hashFiles('kernel/**') }}
          restore-keys: ccache-
      - name: fetch the pinned sources and install the kernel UAPI headers (ADR-0012)
        run: make kernel-src kernel-headers nft-src
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}
      - name: install the web workspace and the Chromium its Playwright run drives, with the libraries Chromium needs (SPEC §11)
        run: make web-install && cd web && npx playwright install --with-deps chromium
      - name: load the nft and 802.1Q modules the sandboxed scenarios use (autoload from a user namespace is not guaranteed)
        run: sudo modprobe nf_conntrack nft_ct nft_fib_inet nft_nat nft_masq nft_chain_nat nft_limit 8021q
      - name: load the PPP modules and open /dev/ppp to the harness user (the runner has no reboot for a udev rule; SPEC §11)
        run: sudo modprobe ppp_generic pppox pppoe ppp_async && sudo chmod 666 /dev/ppp
      - name: let the sandbox's mapped root run pppd (Ubuntu ships it setuid root:dip, mode 4754, so others cannot run it, and inside a user namespace root:dip is unmapped)
        run: sudo chmod 0755 /usr/sbin/pppd
      - run: make kernel
      - run: make check-env
      - run: make test-harness
        env:
          OPENFEO_NO_SKIP: "1" # a kernel that cannot run a scenario fails the build here
      - name: keep the panel's screenshots (each screen in both themes), whether or not the scenarios passed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-shots
          path: build/panel-shots
          if-no-files-found: ignore
